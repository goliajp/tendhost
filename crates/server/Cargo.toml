[package]
name = "tendhost-server"
description = "The tendhost server: assembles the modules into one process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# embed the built dashboard (web/dist must exist: `bun run build` in web/)
web = ["dep:rust-embed"]

[dependencies]
tendhost-kernel.workspace = true
tendhost-store.workspace = true
tendhost-http.workspace = true
tendhost-identity.workspace = true
tendhost-audit.workspace = true
tendhost-hosts.workspace = true
tendhost-telemetry.workspace = true
tendhost-jobs.workspace = true
tendhost-agents.workspace = true
tendhost-notify.workspace = true
tendhost-alerts.workspace = true
tendhost-gateway.workspace = true
anyhow.workspace = true
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
rust-embed = { workspace = true, optional = true }
tracing-subscriber.workspace = true

[dev-dependencies]
tendhost-protocol.workspace = true
chrono.workspace = true
serde_json.workspace = true
toml.workspace = true
tower.workspace = true
