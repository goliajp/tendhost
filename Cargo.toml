[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/goliajp/tendhost"

[workspace.dependencies]
tendhost-kernel = { path = "crates/kernel" }
tendhost-store = { path = "crates/store" }
tendhost-http = { path = "crates/http" }
tendhost-identity = { path = "crates/identity" }
tendhost-audit = { path = "crates/audit" }
tendhost-protocol = { path = "crates/protocol" }
tendhost-hosts = { path = "crates/hosts" }
tendhost-telemetry = { path = "crates/telemetry" }
tendhost-gateway = { path = "crates/gateway" }
tendhost-server = { path = "crates/server" }

anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
data-encoding = "2"
kevy-embedded = "7.0"
rand = "0.10"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sysinfo = "0.40"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
debug = 1
split-debuginfo = "packed"

[profile.release]
strip = true
